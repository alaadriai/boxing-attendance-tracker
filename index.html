<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Boxing Tracker">
<title>Boxing Attendance Tracker</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0a0a;--bg2:#141414;--bg3:#1c1c1c;--bg4:#252525;
  --text:#f0f0f0;--text2:#999;--text3:#555;
  --red:#e63946;--green:#2dc653;--amber:#f4a261;
  --border:#222;--r:14px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:480px;margin:0 auto}
#hdr{display:flex;align-items:center;gap:12px;padding:max(20px,env(safe-area-inset-top)) 16px 14px;background:rgba(10,10,10,.97);border-bottom:1px solid var(--border);flex-shrink:0}
#logo{width:42px;height:42px;border-radius:50%;overflow:hidden;background:var(--red);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff;flex-shrink:0;box-shadow:0 0 0 2px rgba(230,57,70,.25)}
#logo img{width:100%;height:100%;object-fit:cover}
#htxt{flex:1}
#htxt h1{font-size:18px;font-weight:700;letter-spacing:-.3px}
#htxt p{font-size:11px;color:var(--text3);margin-top:2px}
#spill{display:flex;align-items:center;gap:5px;background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:5px 10px;font-size:11px;color:var(--text2)}
#sdot{width:6px;height:6px;border-radius:50%;background:var(--text3);transition:background .3s}
#sdot.ok{background:var(--green);box-shadow:0 0 6px var(--green)}
#sdot.err{background:var(--red)}
#sdot.sp{background:var(--amber);animation:pu 1s infinite}
#content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:72px}
#nav{display:flex;position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(12,12,12,.97);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0;background:none;border:none;color:var(--text3);font-size:10px;font-weight:500;cursor:pointer;transition:color .15s}
.nb.on{color:var(--red)}
.ni{font-size:20px;line-height:1}
section{display:none;padding:16px}
section.on{display:block}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:10px;cursor:pointer;position:relative;overflow:hidden;transition:opacity .15s}
.card:active{opacity:.75}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent;transition:background .15s;border-radius:3px 0 0 3px}
.card.sel::before{background:var(--red)}
.card.tod::before{background:var(--amber)}
.cn{font-size:17px;font-weight:600;margin-bottom:3px}
.ct{font-size:13px;color:var(--text2)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:500;margin-top:8px}
.bt{background:rgba(244,162,97,.1);color:var(--amber);border:1px solid rgba(244,162,97,.2)}
.bs{background:rgba(230,57,70,.08);color:var(--red);border:1px solid rgba(230,57,70,.2)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:15px;border-radius:var(--r);border:none;font-size:15px;font-weight:600;cursor:pointer;width:100%;transition:opacity .15s}
.btn:active{opacity:.75}
.pr{background:var(--red);color:#fff;box-shadow:0 4px 18px rgba(230,57,70,.28)}
.se{background:var(--bg3);color:var(--text);border:1px solid var(--border)}
.sm{padding:11px 15px;font-size:13px}
.tr{display:flex;align-items:center;justify-content:space-between;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
.tl{font-size:14px;color:var(--text2);font-weight:500}
.tg{position:relative;width:46px;height:27px;flex-shrink:0;cursor:pointer}
.tg input{opacity:0;position:absolute;width:0;height:0}
.tk{position:absolute;inset:0;background:var(--bg4);border-radius:14px;border:1px solid var(--border);transition:background .2s}
.tg input:checked+.tk{background:var(--red);border-color:var(--red)}
.th{position:absolute;width:21px;height:21px;background:#fff;border-radius:50%;top:3px;left:3px;transition:transform .2s;box-shadow:0 1px 4px rgba(0,0,0,.4);pointer-events:none}
.tg input:checked~.th{transform:translateX(19px)}
.chead{margin-bottom:6px}
.cname{font-size:22px;font-weight:700;letter-spacing:-.4px}
.csub{font-size:13px;color:var(--text2);margin-top:3px}
.ring-wrap{display:flex;justify-content:center;margin:28px 0}
.ring{width:160px;height:160px;border-radius:50%;border:3px solid var(--border);background:var(--bg2);display:flex;flex-direction:column;align-items:center;justify-content:center}
.rnum{font-size:72px;font-weight:800;line-height:1;letter-spacing:-4px}
.rlbl{font-size:11px;color:var(--text3);margin-top:2px;text-transform:uppercase;letter-spacing:1px}
.cbtns{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:22px}
.cbtn{height:90px;border-radius:var(--r);border:none;font-size:44px;font-weight:200;cursor:pointer;transition:opacity .1s;display:flex;align-items:center;justify-content:center}
.cbtn:active{opacity:.6}
.mi{background:var(--bg3);color:var(--text);border:1px solid var(--border)}
.pl{background:var(--red);color:#fff;box-shadow:0 4px 14px rgba(230,57,70,.22)}
.dv{height:1px;background:var(--border);margin:18px 0}
.fg{margin-bottom:13px}
.fl{font-size:11px;color:var(--text3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.6px;font-weight:500}
.fi{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:13px 14px;color:var(--text);font-size:15px;transition:border-color .15s}
.fi:focus{outline:none;border-color:var(--red)}
select.fi option{background:var(--bg2)}
.chips{display:flex;gap:7px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:7px 14px;border-radius:20px;border:1px solid var(--border);background:var(--bg2);color:var(--text2);font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .15s}
.chip.on{background:var(--red);color:#fff;border-color:var(--red)}
.sc{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.sd{font-size:14px;font-weight:600;margin-bottom:2px}
.scn{font-size:12px;color:var(--text3)}
.sca{font-size:12px;color:var(--amber);margin-top:4px}
.snum{font-size:26px;font-weight:800;color:var(--red);line-height:1}
.iBtn{width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:opacity .15s}
.iBtn:active{opacity:.6}
.stc{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:12px}
.stcn{font-size:15px;font-weight:600;margin-bottom:14px}
.stg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stb{background:var(--bg3);border-radius:10px;padding:14px;text-align:center}
.stv{font-size:30px;font-weight:800;color:var(--red);line-height:1;letter-spacing:-1px}
.stl{font-size:10px;color:var(--text3);margin-top:4px;text-transform:uppercase;letter-spacing:.5px}
.bar-l{display:flex;justify-content:space-between;font-size:11px;color:var(--text3);margin-bottom:5px}
.bar-t{height:5px;background:var(--bg4);border-radius:3px;overflow:hidden}
.bar-f{height:100%;background:linear-gradient(90deg,var(--red),#ff6b6b);border-radius:3px;transition:width .5s}
.stit{font-size:12px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:14px}
.empty{text-align:center;padding:56px 20px;color:var(--text3);font-size:14px;line-height:1.7}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:12px 20px;font-size:14px;font-weight:500;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap;z-index:200;max-width:88vw;box-shadow:0 8px 32px rgba(0,0,0,.4)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;backdrop-filter:blur(4px)}
.modal-sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--bg2);border-top:1px solid var(--border);border-radius:20px 20px 0 0;padding:24px 16px 36px;z-index:101;box-shadow:0 -8px 40px rgba(0,0,0,.5)}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 20px}
.modal-title{font-size:16px;font-weight:700;margin-bottom:18px}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.2}}
</style>
</head>
<body>
<div id="app">
  <div id="hdr">
    <div id="logo">BX</div>
    <div id="htxt"><h1>Boxing Tracker</h1><p>RWTH Hochschulsport Aachen</p></div>
    <div id="spill"><div id="sdot"></div><span id="slbl">—</span></div>
  </div>
  <div id="content">
    <section id="s-home" class="on"></section>
    <section id="s-counter"></section>
    <section id="s-history"></section>
    <section id="s-stats"></section>
  </div>
  <nav id="nav">
    <button class="nb on" id="nb-home"    onclick="go('home')">   <span class="ni">🏠</span>Home</button>
    <button class="nb"    id="nb-counter" onclick="go('counter')"><span class="ni">🥊</span>Counter</button>
    <button class="nb"    id="nb-history" onclick="go('history')"><span class="ni">📋</span>History</button>
    <button class="nb"    id="nb-stats"   onclick="go('stats')">  <span class="ni">📊</span>Stats</button>
  </nav>
</div>
<div id="toast"></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import{getFirestore,collection,addDoc,doc,updateDoc,deleteDoc,query,orderBy,onSnapshot,serverTimestamp}
  from"https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

const db=getFirestore(initializeApp({
  apiKey:"AIzaSyD5m5QOdKK6Vy5Sr0HWciuviy0rAlvsik8",
  authDomain:"boxing-tracker-8fab1.firebaseapp.com",
  projectId:"boxing-tracker-8fab1",
  storageBucket:"boxing-tracker-8fab1.firebasestorage.app",
  messagingSenderId:"285906789422",
  appId:"1:285906789422:web:8a2b773c865bea8e94ebbf"
}));
const col=collection(db,'sessions');

const COURSES=[
  {id:'c1',name:'Boxing Level 1',      day:1,h:20,m:0, lbl:'Monday 20:00'},
  {id:'c2',name:'Boxing Fitness',       day:1,h:21,m:30,lbl:'Monday 21:30'},
  {id:'c3',name:'Boxing Level 1 to 2', day:4,h:21,m:30,lbl:'Thursday 21:30'},
];

let sessions=[],cur='home',selC=null,autoD=true,cnt=0,actC=null,hFil='all';

/* ── helpers ── */
function setSync(s){
  const d=document.getElementById('sdot'),l=document.getElementById('slbl');
  if(!d||!l)return;
  d.className='';
  if(s==='ok'){d.classList.add('ok');l.textContent='synced'}
  else if(s==='err'){d.classList.add('err');l.textContent='offline'}
  else{d.classList.add('sp');l.textContent='sync…'}
}
function detect(){
  const now=new Date(),day=now.getDay(),m=now.getHours()*60+now.getMinutes();
  return COURSES.find(c=>c.day===day&&m>=c.h*60+c.m-60&&m<=c.h*60+c.m+120)||null;
}
const fmtD=d=>d?new Date(d).toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'}):'';
const dateNow=()=>new Date().toISOString().split('T')[0];
const timeNow=()=>new Date().toTimeString().slice(0,5);
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2600)}

/* ── nav ── */
window.go=function(s){
  cur=s;
  document.querySelectorAll('section').forEach(x=>x.classList.remove('on'));
  const sec=document.getElementById('s-'+s);if(sec)sec.classList.add('on');
  ['home','counter','history','stats'].forEach(n=>{const b=document.getElementById('nb-'+n);if(b)b.classList.toggle('on',n===s)});
  if(s==='home')    renderHome();
  if(s==='counter') renderCounter();
  if(s==='history') renderHistory(hFil);
  if(s==='stats')   renderStats();
};

/* ── HOME ── */
function renderHome(){
  const det=autoD?detect():null;
  if(!selC)selC=det?det.id:COURSES[0].id;
  let h=`<div class="tr"><span class="tl">Auto-detect course</span>
    <label class="tg"><input type="checkbox" ${autoD?'checked':''} onchange="setAuto(this.checked)"><span class="tk"></span><span class="th"></span></label>
  </div><div class="stit">Select Course</div>`;
  for(const c of COURSES){
    const isSel=selC===c.id,isDet=det&&det.id===c.id;
    h+=`<div class="card ${isSel?'sel':''} ${isDet?'tod':''}" onclick="pick('${c.id}')">
      <div class="cn">${c.name}</div><div class="ct">${c.lbl}</div>
      ${isDet?'<span class="badge bt">📍 Today\'s course</span>':''}
      ${isSel&&!isDet?'<span class="badge bs">✓ Selected</span>':''}
    </div>`;
  }
  h+=`<div style="margin-top:20px"><button class="btn pr" onclick="startCount()">🥊 &nbsp;Start Counting</button></div>`;
  document.getElementById('s-home').innerHTML=h;
}
window.setAuto=v=>{autoD=v;const d=v?detect():null;if(d)selC=d.id;renderHome()};
window.pick=id=>{selC=id;renderHome()};
window.startCount=()=>{actC=COURSES.find(c=>c.id===selC);cnt=0;go('counter')};

/* ── COUNTER ── */
function renderCounter(){
  const c=actC||COURSES[0];
  document.getElementById('s-counter').innerHTML=`
    <div class="chead"><div class="cname">${c.name}</div><div class="csub">${c.lbl}</div></div>
    <div class="ring-wrap"><div class="ring"><div class="rnum" id="rnum">${cnt}</div><div class="rlbl">participants</div></div></div>
    <div class="cbtns">
      <button class="cbtn mi" onclick="adj(-1)">－</button>
      <button class="cbtn pl" onclick="adj(1)">＋</button>
    </div>
    <div class="dv"></div>
    <div class="tr" style="margin-bottom:14px"><span class="tl">Mark as cancelled</span>
      <label class="tg"><input type="checkbox" id="ctog" onchange="showR(this.checked)"><span class="tk"></span><span class="th"></span></label>
    </div>
    <div id="rwrap" style="display:none" class="fg">
      <div class="fl">Reason (optional)</div><input class="fi" id="creason" placeholder="e.g. Public holiday…">
    </div>
    <div class="fg"><div class="fl">Date</div><input class="fi" id="sdate" type="date" value="${dateNow()}"></div>
    <div class="fg"><div class="fl">Time</div><input class="fi" id="stime" type="time" value="${timeNow()}"></div>
    <div class="fg"><div class="fl">Course</div>
      <select class="fi" id="scourse">${COURSES.map(x=>`<option value="${x.id}"${x.id===c.id?' selected':''}>${x.name}</option>`).join('')}</select>
    </div>
    <button class="btn pr" style="margin-top:6px" onclick="save()">💾 &nbsp;Save Session</button>`;
}
window.adj=d=>{cnt=Math.max(0,cnt+d);const el=document.getElementById('rnum');if(el)el.textContent=cnt};
window.showR=v=>{const w=document.getElementById('rwrap');if(w)w.style.display=v?'block':'none'};
window.save=async()=>{
  setSync('load');
  const cancelled=document.getElementById('ctog')?.checked||false;
  const reason=document.getElementById('creason')?.value.trim()||'';
  const date=document.getElementById('sdate')?.value;
  const time=document.getElementById('stime')?.value;
  const courseId=document.getElementById('scourse')?.value||actC?.id||COURSES[0].id;
  try{
    await addDoc(col,{courseId,count:cnt,cancelled,reason,date,time,ts:serverTimestamp()});
    setSync('ok');cnt=0;
    toast(cancelled?'Saved as cancelled ✓':'Saved ✓');
    setTimeout(()=>go('history'),700);
  }catch(e){setSync('err');toast('Save failed ⚠')}
};

/* ── HISTORY ── */
function renderHistory(f){
  hFil=f||'all';
  const list=(hFil==='all'?sessions:sessions.filter(s=>s.courseId===hFil))
    .slice().sort((a,b)=>(b.ts?.seconds||0)-(a.ts?.seconds||0));
  let h=`
    <a href="https://hochschulsport.rwth-aachen.de/cms/hsz/das-hochschulsportzentrum/~jvfj/informationen-fuer-uebungsleitende/"
      target="_blank" class="btn se" style="text-decoration:none;margin-bottom:10px">📅 RWTH Schedule</a>
    <button class="btn se sm" style="margin-bottom:14px" onclick="doCSV()">⬇ Export CSV</button>
    <div class="chips">
      <button class="chip ${hFil==='all'?'on':''}" onclick="renderHistory('all')">All</button>
      ${COURSES.map(c=>`<button class="chip ${hFil===c.id?'on':''}" onclick="renderHistory('${c.id}')">${c.name.replace('Boxing ','')}</button>`).join('')}
    </div>`;
  if(!list.length){
    h+=`<div class="empty">No sessions yet.<br>Head to Counter to record one.</div>`;
  } else {
    list.forEach(s=>{
      const cn=COURSES.find(c=>c.id===s.courseId)?.name||'Unknown';
      h+=`<div class="sc">
        <div style="flex:1;min-width:0">
          <div class="sd">${fmtD(s.date)} ${s.time||''}</div>
          <div class="scn">${cn}</div>
          ${s.cancelled?`<div class="sca">⚠ Cancelled${s.reason?' — '+s.reason:''}</div>`:''}
        </div>
        <div style="display:flex;align-items:center;gap:10px;flex-shrink:0;margin-left:12px">
          <div class="snum">${s.cancelled?'—':s.count}</div>
          <div style="display:flex;flex-direction:column;gap:6px">
            <button class="iBtn" onclick="openEdit('${s.id}')">✏️</button>
            <button class="iBtn" onclick="delSession('${s.id}')">🗑️</button>
          </div>
        </div>
      </div>`;
    });
  }
  document.getElementById('s-history').innerHTML=h;
}
window.renderHistory=renderHistory;

/* ── EDIT MODAL ── */
window.openEdit=function(id){
  const s=sessions.find(x=>x.id===id);
  if(!s)return;
  closeEdit();
  const m=document.createElement('div');
  m.id='editModal';
  m.innerHTML=`
    <div class="modal-backdrop" onclick="closeEdit()"></div>
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div class="modal-title">Edit Session</div>
      <div class="fg"><div class="fl">Count</div><input class="fi" id="eCount" type="number" min="0" value="${s.cancelled?0:s.count}"></div>
      <div class="fg"><div class="fl">Date</div><input class="fi" id="eDate" type="date" value="${s.date||''}"></div>
      <div class="fg"><div class="fl">Time</div><input class="fi" id="eTime" type="time" value="${s.time||''}"></div>
      <div class="fg"><div class="fl">Course</div>
        <select class="fi" id="eCourse">${COURSES.map(c=>`<option value="${c.id}"${c.id===s.courseId?' selected':''}>${c.name}</option>`).join('')}</select>
      </div>
      <div class="tr" style="margin-bottom:14px"><span class="tl">Cancelled</span>
        <label class="tg"><input type="checkbox" id="eCancelled" ${s.cancelled?'checked':''} onchange="toggleER(this.checked)"><span class="tk"></span><span class="th"></span></label>
      </div>
      <div id="eRWrap" style="display:${s.cancelled?'block':'none'}" class="fg">
        <div class="fl">Reason</div><input class="fi" id="eReason" value="${s.reason||''}" placeholder="e.g. Public holiday…">
      </div>
      <div style="display:flex;gap:10px;margin-top:8px">
        <button class="btn se" onclick="closeEdit()">Cancel</button>
        <button class="btn pr" onclick="saveEdit('${id}')">💾 Save</button>
      </div>
    </div>`;
  document.body.appendChild(m);
};
window.toggleER=v=>{const w=document.getElementById('eRWrap');if(w)w.style.display=v?'block':'none'};
window.closeEdit=()=>{const m=document.getElementById('editModal');if(m)m.remove()};
window.saveEdit=async function(id){
  const count=parseInt(document.getElementById('eCount')?.value)||0;
  const date=document.getElementById('eDate')?.value||'';
  const time=document.getElementById('eTime')?.value||'';
  const courseId=document.getElementById('eCourse')?.value||COURSES[0].id;
  const cancelled=document.getElementById('eCancelled')?.checked||false;
  const reason=document.getElementById('eReason')?.value.trim()||'';
  try{
    await updateDoc(doc(db,'sessions',id),{count,date,time,courseId,cancelled,reason});
    toast('Updated ✓');closeEdit();
  }catch(e){toast('Update failed ⚠');console.error(e)}
};
window.delSession=async function(id){
  if(!confirm('Delete this session? This cannot be undone.'))return;
  try{
    await deleteDoc(doc(db,'sessions',id));
    toast('Deleted');
  }catch(e){toast('Delete failed ⚠');console.error(e)}
};

/* ── STATS ── */
function renderStats(){
  const sec=document.getElementById('s-stats');
  if(!sessions.length){sec.innerHTML=`<div class="empty">No data yet.<br>Record your first session!</div>`;return}
  let maxA=0;
  const data=COURSES.map(c=>{
    const s=sessions.filter(x=>x.courseId===c.id&&!x.cancelled);
    const canc=sessions.filter(x=>x.courseId===c.id&&x.cancelled).length;
    const avg=s.length?Math.round(s.reduce((a,x)=>a+x.count,0)/s.length):0;
    if(avg>maxA)maxA=avg;
    return{c,s,canc,avg};
  });
  sec.innerHTML=data.map(({c,s,canc,avg})=>{
    const pct=maxA?Math.round(avg/maxA*100):0;
    return`<div class="stc">
      <div class="stcn">${c.name}</div>
      <div class="stg">
        <div class="stb"><div class="stv">${avg}</div><div class="stl">Avg attendance</div></div>
        <div class="stb"><div class="stv">${s.length}</div><div class="stl">Sessions</div></div>
      </div>
      ${canc?`<div style="font-size:12px;color:var(--amber);margin-bottom:10px">⚠ ${canc} cancelled</div>`:''}
      <div class="bar-l"><span>Avg vs best</span><span>${avg}</span></div>
      <div class="bar-t"><div class="bar-f" style="width:${pct}%"></div></div>
    </div>`;
  }).join('');
}

/* ── CSV ── */
window.doCSV=function(){
  const rows=[['Course','Date','Time','Count','Cancelled','Reason']];
  [...sessions].sort((a,b)=>(a.ts?.seconds||0)-(b.ts?.seconds||0)).forEach(s=>{
    const cn=COURSES.find(c=>c.id===s.courseId)?.name||s.courseId;
    rows.push([cn,s.date,s.time||'',s.cancelled?'':s.count,s.cancelled?'Yes':'No',s.reason||'']);
  });
  const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=Object.assign(document.createElement('a'),{
    href:URL.createObjectURL(new Blob([csv],{type:'text/csv'})),
    download:'boxing_attendance.csv'
  });
  a.click();toast('CSV exported ✓');
};

/* ── FIRESTORE LIVE SYNC ── */
setSync('load');
onSnapshot(query(col,orderBy('ts','desc')),snap=>{
  sessions=snap.docs.map(d=>({id:d.id,...d.data()}));
  setSync('ok');
  if(cur==='history')renderHistory(hFil);
  if(cur==='stats')renderStats();
},err=>{setSync('err');console.error(err)});

/* ── INIT ── */
const img=new Image();
img.onload=()=>{document.getElementById('logo').innerHTML=`<img src="logo.jpg" alt="logo">`};
img.src='logo.jpg';
renderHome();
