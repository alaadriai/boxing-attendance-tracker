<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Boxing Tracker">
<title>Boxing Attendance Tracker</title>
<link rel="manifest" href="#" id="manifest-link">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
--bg:#0a0a0a;--bg2:#141414;--bg3:#1e1e1e;--bg4:#272727;
--text:#f0f0f0;--text2:#a0a0a0;--text3:#606060;
--red:#e63946;--red2:#c1121f;--green:#2dc653;--amber:#f4a261;
--border:#2a2a2a;--radius:12px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:480px;margin:0 auto;position:relative}
#header{display:flex;align-items:center;gap:12px;padding:16px 16px 12px;background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0;padding-top:max(16px,env(safe-area-inset-top))}
#header img{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--bg3)}
#header-logo-fallback{width:36px;height:36px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;flex-shrink:0}
#header h1{font-size:16px;font-weight:600;flex:1}
#screen-label{font-size:12px;color:var(--text3);text-align:right}
#content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:80px}
#nav{display:flex;position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--bg2);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;background:none;border:none;color:var(--text3);font-size:10px;cursor:pointer;transition:color .15s}
.nav-btn.active{color:var(--red)}
.nav-icon{font-size:22px;line-height:1}
section{display:none;padding:16px}
section.active{display:block}

/* HOME */
.course-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:12px;cursor:pointer;transition:border-color .15s}
.course-card:active{background:var(--bg3)}
.course-card.selected{border-color:var(--red)}
.course-card.today{border-color:var(--amber)}
.course-name{font-size:18px;font-weight:600;margin-bottom:4px}
.course-time{font-size:14px;color:var(--text2)}
.course-badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;margin-top:8px}
.badge-today{background:rgba(244,162,97,.15);color:var(--amber)}
.badge-selected{background:rgba(230,57,70,.15);color:var(--red)}
.home-actions{display:flex;gap:10px;margin-top:20px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:16px;border-radius:var(--radius);border:none;font-size:16px;font-weight:600;cursor:pointer;transition:opacity .15s;width:100%}
.btn:active{opacity:.7}
.btn-primary{background:var(--red);color:#fff}
.btn-secondary{background:var(--bg3);color:var(--text);border:1px solid var(--border)}
.btn-sm{padding:10px 16px;font-size:14px}
.auto-detect-row{display:flex;align-items:center;justify-content:space-between;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:16px}
.auto-detect-label{font-size:14px;color:var(--text2)}
.toggle{position:relative;width:44px;height:26px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;inset:0;background:var(--bg4);border-radius:13px;cursor:pointer;transition:background .2s}
.toggle-slider:before{content:'';position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .2s}
.toggle input:checked+.toggle-slider{background:var(--red)}
.toggle input:checked+.toggle-slider:before{transform:translateX(18px)}

/* COUNTER */
.counter-course{font-size:20px;font-weight:700;margin-bottom:4px}
.counter-datetime{font-size:13px;color:var(--text2);margin-bottom:20px}
.count-display{text-align:center;margin:24px 0}
.count-num{font-size:88px;font-weight:700;line-height:1;color:var(--text)}
.count-label{font-size:13px;color:var(--text3);margin-top:4px}
.count-btns{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
.count-btn{height:100px;border-radius:var(--radius);border:none;font-size:48px;font-weight:300;cursor:pointer;transition:opacity .15s;display:flex;align-items:center;justify-content:center}
.count-btn:active{opacity:.6}
.btn-minus{background:var(--bg3);color:var(--text);border:1px solid var(--border)}
.btn-plus{background:var(--red);color:#fff}
.field-group{margin-bottom:14px}
.field-label{font-size:12px;color:var(--text3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.field-input{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:12px;color:var(--text);font-size:15px}
.field-input:focus{outline:none;border-color:var(--red)}
.cancelled-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-bottom:14px}
.cancelled-label{font-size:15px}

/* HISTORY */
.history-controls{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px}
.filter-btn{padding:8px 14px;border-radius:20px;border:1px solid var(--border);background:var(--bg2);color:var(--text2);font-size:13px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.filter-btn.active{background:var(--red);color:#fff;border-color:var(--red)}
.session-item{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:8px}
.session-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px}
.session-date{font-size:14px;font-weight:600}
.session-count{font-size:22px;font-weight:700;color:var(--red)}
.session-course{font-size:12px;color:var(--text3)}
.session-cancelled{font-size:12px;color:var(--amber);margin-top:4px}
.session-reason{font-size:12px;color:var(--text3);margin-top:2px}
.empty-state{text-align:center;padding:60px 20px;color:var(--text3)}
.export-btn{margin-bottom:16px}
.rwth-btn{margin-bottom:16px}

/* STATS */
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:12px}
.stat-course{font-size:15px;font-weight:600;margin-bottom:12px}
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat-box{background:var(--bg3);border-radius:8px;padding:12px;text-align:center}
.stat-val{font-size:28px;font-weight:700;color:var(--red)}
.stat-lbl{font-size:11px;color:var(--text3);margin-top:2px;text-transform:uppercase;letter-spacing:.5px}
.stat-bar-wrap{margin-top:12px}
.stat-bar-label{display:flex;justify-content:space-between;font-size:12px;color:var(--text2);margin-bottom:4px}
.stat-bar{height:6px;background:var(--bg4);border-radius:3px;overflow:hidden}
.stat-bar-fill{height:100%;background:var(--red);border-radius:3px;transition:width .4s}

/* TOAST */
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:12px 20px;font-size:14px;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap;z-index:999;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

select.field-input option{background:var(--bg2)}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div id="header-logo-fallback">BX</div>
    <h1>Boxing Tracker</h1>
    <span id="screen-label">Home</span>
  </div>
  <div id="content">
    <section id="sec-home" class="active"></section>
    <section id="sec-counter"></section>
    <section id="sec-history"></section>
    <section id="sec-stats"></section>
  </div>
  <nav id="nav">
    <button class="nav-btn active" data-screen="home" onclick="navigate('home')">
      <span class="nav-icon">🏠</span><span>Home</span>
    </button>
    <button class="nav-btn" data-screen="counter" onclick="navigate('counter')">
      <span class="nav-icon">🥊</span><span>Counter</span>
    </button>
    <button class="nav-btn" data-screen="history" onclick="navigate('history')">
      <span class="nav-icon">📋</span><span>History</span>
    </button>
    <button class="nav-btn" data-screen="stats" onclick="navigate('stats')">
      <span class="nav-icon">📊</span><span>Stats</span>
    </button>
  </nav>
</div>
<div id="toast"></div>

<script>
const COURSES = [
  {id:'c1', name:'Boxing Level 1', day:1, hour:20, min:0, display:'Monday 20:00'},
  {id:'c2', name:'Boxing Fitness', day:1, hour:21, min:30, display:'Monday 21:30'},
  {id:'c3', name:'Boxing Level 1 to 2', day:4, hour:21, min:30, display:'Thursday 21:30'},
];

let db, state = {screen:'home', selectedCourse:null, autoDetect:true, count:0, counterCourse:null};

function openDB(){
  return new Promise((res,rej)=>{
    const req = indexedDB.open('BoxingTracker',1);
    req.onupgradeneeded = e=>{
      const d = e.target.result;
      if(!d.objectStoreNames.contains('sessions')){
        const s = d.createObjectStore('sessions',{keyPath:'id',autoIncrement:true});
        s.createIndex('courseId','courseId',{unique:false});
        s.createIndex('date','date',{unique:false});
      }
      if(!d.objectStoreNames.contains('prefs')){
        d.createObjectStore('prefs',{keyPath:'key'});
      }
    };
    req.onsuccess = e=>{db=e.target.result;res(db)};
    req.onerror = ()=>rej(req.error);
  });
}

function dbGet(store,key){
  return new Promise((res,rej)=>{
    const tx=db.transaction(store,'readonly');
    const req=tx.objectStore(store).get(key);
    req.onsuccess=()=>res(req.result);
    req.onerror=()=>rej(req.error);
  });
}
function dbPut(store,val){
  return new Promise((res,rej)=>{
    const tx=db.transaction(store,'readwrite');
    const req=tx.objectStore(store).put(val);
    req.onsuccess=()=>res(req.result);
    req.onerror=()=>rej(req.error);
  });
}
function dbGetAll(store){
  return new Promise((res,rej)=>{
    const tx=db.transaction(store,'readonly');
    const req=tx.objectStore(store).getAll();
    req.onsuccess=()=>res(req.result);
    req.onerror=()=>rej(req.error);
  });
}

function detectCourse(){
  const now=new Date();
  const day=now.getDay();
  const h=now.getHours(), m=now.getMinutes();
  const mins=h*60+m;
  for(const c of COURSES){
    if(c.day===day){
      const start=c.hour*60+c.min;
      if(mins>=start-60 && mins<=start+120) return c;
    }
  }
  return null;
}

function fmtDate(d){
  const dt=new Date(d);
  return dt.toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'});
}
function fmtDateInput(d){
  const dt=d?new Date(d):new Date();
  return dt.toISOString().split('T')[0];
}
function fmtTimeInput(d){
  const dt=d?new Date(d):new Date();
  return dt.toTimeString().slice(0,5);
}

function navigate(screen){
  state.screen=screen;
  document.querySelectorAll('section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.screen===screen));
  document.getElementById('sec-'+screen).classList.add('active');
  const labels={home:'Home',counter:'Counter',history:'History',stats:'Stats'};
  document.getElementById('screen-label').textContent=labels[screen];
  if(screen==='home') renderHome();
  if(screen==='counter') renderCounter();
  if(screen==='history') renderHistory('all');
  if(screen==='stats') renderStats();
}

function renderHome(){
  const detected = state.autoDetect ? detectCourse() : null;
  if(!state.selectedCourse){
    state.selectedCourse = detected ? detected.id : COURSES[0].id;
  }
  let html=`<div class="auto-detect-row">
    <span class="auto-detect-label">Auto-detect today's course</span>
    <label class="toggle"><input type="checkbox" id="auto-toggle" ${state.autoDetect?'checked':''} onchange="toggleAuto(this.checked)"><span class="toggle-slider"></span></label>
  </div>`;
  html+=`<div style="margin-bottom:8px;font-size:13px;color:var(--text3)">Select course</div>`;
  for(const c of COURSES){
    const isDetected = detected && detected.id===c.id;
    const isSelected = state.selectedCourse===c.id;
    html+=`<div class="course-card ${isSelected?'selected':''} ${isDetected?'today':''}" onclick="selectCourse('${c.id}')">
      <div class="course-name">${c.name}</div>
      <div class="course-time">${c.display}</div>
      ${isDetected?'<span class="course-badge badge-today">📍 Detected today</span>':''}
      ${isSelected&&!isDetected?'<span class="course-badge badge-selected">✓ Selected</span>':''}
    </div>`;
  }
  html+=`<div class="home-actions">
    <button class="btn btn-primary" onclick="goCounter()">🥊 Start Counting</button>
  </div>`;
  document.getElementById('sec-home').innerHTML=html;
}

function toggleAuto(val){
  state.autoDetect=val;
  const detected=val?detectCourse():null;
  if(detected) state.selectedCourse=detected.id;
  renderHome();
}

function selectCourse(id){
  state.selectedCourse=id;
  renderHome();
}

function goCounter(){
  state.counterCourse=COURSES.find(c=>c.id===state.selectedCourse);
  state.count=0;
  navigate('counter');
}

function renderCounter(){
  const c=state.counterCourse||COURSES[0];
  const now=new Date();
  const html=`
    <div class="counter-course">${c.name}</div>
    <div class="counter-datetime">${c.display}</div>
    <div class="count-display">
      <div class="count-num" id="count-num">${state.count}</div>
      <div class="count-label">participants</div>
    </div>
    <div class="count-btns">
      <button class="count-btn btn-minus" onclick="changeCount(-1)">－</button>
      <button class="count-btn btn-plus" onclick="changeCount(1)">＋</button>
    </div>
    <div class="cancelled-row">
      <span class="cancelled-label">Mark as cancelled</span>
      <label class="toggle"><input type="checkbox" id="cancelled-toggle" onchange="toggleCancelReason(this.checked)"><span class="toggle-slider"></span></label>
    </div>
    <div id="reason-wrap" style="display:none;margin-bottom:14px">
      <div class="field-label">Cancellation reason (optional)</div>
      <input class="field-input" id="cancel-reason" type="text" placeholder="e.g. Public holiday, trainer sick...">
    </div>
    <div class="field-group">
      <div class="field-label">Date</div>
      <input class="field-input" id="session-date" type="date" value="${fmtDateInput()}">
    </div>
    <div class="field-group">
      <div class="field-label">Time</div>
      <input class="field-input" id="session-time" type="time" value="${fmtTimeInput()}">
    </div>
    <div class="field-group">
      <div class="field-label">Course</div>
      <select class="field-input" id="session-course">
        ${COURSES.map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${x.name}</option>`).join('')}
      </select>
    </div>
    <button class="btn btn-primary" style="margin-top:8px" onclick="saveSession()">💾 Save Session</button>
  `;
  document.getElementById('sec-counter').innerHTML=html;
}

function changeCount(d){
  state.count=Math.max(0,state.count+d);
  const el=document.getElementById('count-num');
  if(el) el.textContent=state.count;
}

function toggleCancelReason(v){
  const w=document.getElementById('reason-wrap');
  if(w) w.style.display=v?'block':'none';
}

async function saveSession(){
  const cancelled=document.getElementById('cancelled-toggle')?.checked||false;
  const reason=document.getElementById('cancel-reason')?.value.trim()||'';
  const date=document.getElementById('session-date')?.value;
  const time=document.getElementById('session-time')?.value;
  const courseId=document.getElementById('session-course')?.value||state.counterCourse?.id||COURSES[0].id;
  const session={
    courseId,
    count:state.count,
    cancelled,
    reason,
    date,
    time,
    ts:Date.now()
  };
  await dbPut('sessions',session);
  showToast(cancelled?'Session saved as cancelled ✓':`Saved — ${state.count} participants ✓`);
  state.count=0;
  setTimeout(()=>navigate('history'),800);
}

let historyFilter='all';
async function renderHistory(filter){
  historyFilter=filter||historyFilter;
  const all=await dbGetAll('sessions');
  all.sort((a,b)=>b.ts-a.ts);
  const filtered=historyFilter==='all'?all:all.filter(s=>s.courseId===historyFilter);
  let html=`<a href="https://hochschulsport.rwth-aachen.de/cms/hsz/das-hochschulsportzentrum/~jvfj/informationen-fuer-uebungsleitende/" target="_blank" class="btn btn-secondary rwth-btn" style="text-decoration:none;display:flex">📅 Check RWTH Schedule</a>`;
  html+=`<button class="btn btn-secondary btn-sm export-btn" onclick="exportCSV()">⬇ Export CSV</button>`;
  html+=`<div class="history-controls">
    <button class="filter-btn ${historyFilter==='all'?'active':''}" onclick="renderHistory('all')">All</button>
    ${COURSES.map(c=>`<button class="filter-btn ${historyFilter===c.id?'active':''}" onclick="renderHistory('${c.id}')">${c.name.replace('Boxing ','')}</button>`).join('')}
  </div>`;
  if(!filtered.length){
    html+=`<div class="empty-state">No sessions yet.<br>Start counting! 🥊</div>`;
  } else {
    for(const s of filtered){
      const course=COURSES.find(c=>c.id===s.courseId);
      html+=`<div class="session-item">
        <div class="session-header">
          <div>
            <div class="session-date">${fmtDate(s.date)} ${s.time||''}</div>
            <div class="session-course">${course?course.name:'Unknown'}</div>
            ${s.cancelled?`<div class="session-cancelled">⚠ Cancelled${s.reason?' — '+s.reason:''}</div>`:''}
          </div>
          <div class="session-count">${s.cancelled?'—':s.count}</div>
        </div>
      </div>`;
    }
  }
  document.getElementById('sec-history').innerHTML=html;
}

async function exportCSV(){
  const all=await dbGetAll('sessions');
  all.sort((a,b)=>a.ts-b.ts);
  const rows=[['ID','Course','Date','Time','Count','Cancelled','Reason']];
  for(const s of all){
    const c=COURSES.find(x=>x.id===s.courseId);
    rows.push([s.id,c?c.name:s.courseId,s.date,s.time||'',s.cancelled?'':s.count,s.cancelled?'Yes':'No',s.reason||'']);
  }
  const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='boxing_attendance.csv';a.click();
  URL.revokeObjectURL(url);
  showToast('CSV exported ✓');
}

async function renderStats(){
  const all=await dbGetAll('sessions');
  let html='';
  let maxAvg=0;
  const courseStats=COURSES.map(c=>{
    const sessions=all.filter(s=>s.courseId===c.id&&!s.cancelled);
    const cancelled=all.filter(s=>s.courseId===c.id&&s.cancelled).length;
    const total=sessions.reduce((sum,s)=>sum+s.count,0);
    const avg=sessions.length?Math.round(total/sessions.length):0;
    if(avg>maxAvg) maxAvg=avg;
    return {c,sessions,cancelled,total,avg};
  });
  for(const {c,sessions,cancelled,avg} of courseStats){
    const barPct=maxAvg>0?Math.round(avg/maxAvg*100):0;
    html+=`<div class="stat-card">
      <div class="stat-course">${c.name}</div>
      <div class="stat-row">
        <div class="stat-box"><div class="stat-val">${avg}</div><div class="stat-lbl">Avg attendance</div></div>
        <div class="stat-box"><div class="stat-val">${sessions.length}</div><div class="stat-lbl">Sessions</div></div>
      </div>
      ${cancelled>0?`<div style="font-size:12px;color:var(--amber);margin-top:10px">⚠ ${cancelled} session${cancelled>1?'s':''} cancelled</div>`:''}
      <div class="stat-bar-wrap">
        <div class="stat-bar-label"><span>Attendance</span><span>${avg} avg</span></div>
        <div class="stat-bar"><div class="stat-bar-fill" style="width:${barPct}%"></div></div>
      </div>
    </div>`;
  }
  if(!all.length) html=`<div class="empty-state">No data yet.<br>Record your first session! 🥊</div>`;
  document.getElementById('sec-stats').innerHTML=html;
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

function injectManifest(){
  const manifest={
    name:'Boxing Attendance Tracker',
    short_name:'Boxing Tracker',
    description:'Track headcount for RWTH Hochschulsport boxing courses',
    start_url:'.',
    display:'standalone',
    background_color:'#0a0a0a',
    theme_color:'#0a0a0a',
    orientation:'portrait',
    icons:[
      {src:'logo.jpg',sizes:'192x192',type:'image/jpeg'},
      {src:'logo.jpg',sizes:'512x512',type:'image/jpeg'}
    ]
  };
  const blob=new Blob([JSON.stringify(manifest)],{type:'application/json'});
  document.getElementById('manifest-link').href=URL.createObjectURL(blob);
}

const SW_CODE=`
const CACHE='boxing-v1';
const ASSETS=['.','./index.html'];
self.addEventListener('install',e=>{e.waitUntil(caches.open(CACHE).then(c=>c.addAll(ASSETS)));self.skipWaiting()});
self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==CACHE).map(k=>caches.delete(k)))));self.clients.claim()});
self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(res=>{if(res.status===200){const c=res.clone();caches.open(CACHE).then(cache=>cache.put(e.request,c))}return res}).catch(()=>caches.match('.'))))});
`;

function registerSW(){
  if(!('serviceWorker' in navigator)) return;
  const blob=new Blob([SW_CODE],{type:'application/javascript'});
  const url=URL.createObjectURL(blob);
  navigator.serviceWorker.register(url,{scope:'./'}).catch(()=>{});
}

async function init(){
  await openDB();
  injectManifest();
  registerSW();
  renderHome();
  const img=new Image();
  img.onload=()=>{
    const fb=document.getElementById('header-logo-fallback');
    if(fb){fb.outerHTML=`<img src="logo.jpg" alt="Logo" style="width:36px;height:36px;border-radius:50%;object-fit:cover">`;}
  };
  img.src='logo.jpg';
}
init();
</script>
