<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Boxing Tracker">
<title>Boxing Attendance Tracker</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0a0a;--bg2:#141414;--bg3:#1c1c1c;--bg4:#252525;
  --text:#f0f0f0;--text2:#999;--text3:#555;
  --red:#e63946;--green:#2dc653;--amber:#f4a261;
  --border:#222;--radius:14px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:480px;margin:0 auto}

/* HEADER */
#header{display:flex;align-items:center;gap:12px;padding:env(safe-area-inset-top) 16px 0;padding-top:max(20px,env(safe-area-inset-top));padding-bottom:14px;background:rgba(10,10,10,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);flex-shrink:0}
#logo-wrap{width:38px;height:38px;border-radius:50%;overflow:hidden;background:var(--red);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff;flex-shrink:0;box-shadow:0 0 0 2px rgba(230,57,70,.3)}
#logo-wrap img{width:100%;height:100%;object-fit:cover}
#header-text{flex:1}
#header h1{font-size:17px;font-weight:700;letter-spacing:-.3px}
#header-sub{font-size:11px;color:var(--text3);margin-top:1px}
#sync-pill{display:flex;align-items:center;gap:5px;background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:5px 10px;font-size:11px;color:var(--text2)}
#sync-dot{width:6px;height:6px;border-radius:50%;background:var(--text3);transition:background .3s;flex-shrink:0}
#sync-dot.ok{background:var(--green);box-shadow:0 0 6px var(--green)}
#sync-dot.err{background:var(--red)}
#sync-dot.loading{background:var(--amber);animation:pulse 1s infinite}

/* CONTENT & NAV */
#content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:72px}
#nav{display:flex;position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(14,14,14,.97);backdrop-filter:blur(12px);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0;background:none;border:none;color:var(--text3);font-size:10px;font-weight:500;cursor:pointer;transition:color .15s;letter-spacing:.3px}
.nav-btn.active{color:var(--red)}
.nav-btn .nav-icon{font-size:20px;line-height:1}
section{display:none;padding:16px}
section.active{display:block}

/* CARDS & BUTTONS */
.course-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:10px;cursor:pointer;transition:all .15s;position:relative;overflow:hidden}
.course-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent;transition:background .15s}
.course-card.selected::before{background:var(--red)}
.course-card.today::before{background:var(--amber)}
.course-card:active{opacity:.8}
.course-name{font-size:17px;font-weight:600;margin-bottom:3px}
.course-time{font-size:13px;color:var(--text2)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:500;margin-top:8px}
.badge-today{background:rgba(244,162,97,.12);color:var(--amber);border:1px solid rgba(244,162,97,.2)}
.badge-selected{background:rgba(230,57,70,.1);color:var(--red);border:1px solid rgba(230,57,70,.2)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:16px;border-radius:var(--radius);border:none;font-size:15px;font-weight:600;cursor:pointer;transition:all .15s;width:100%;letter-spacing:-.2px}
.btn:active{transform:scale(.98);opacity:.85}
.btn-primary{background:var(--red);color:#fff;box-shadow:0 4px 20px rgba(230,57,70,.3)}
.btn-secondary{background:var(--bg3);color:var(--text);border:1px solid var(--border)}
.btn-sm{padding:11px 16px;font-size:13px}

/* TOGGLE */
.row-toggle{display:flex;align-items:center;justify-content:space-between;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px}
.row-label{font-size:14px;color:var(--text2);font-weight:500}
.toggle{position:relative;width:46px;height:27px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.toggle-track{position:absolute;inset:0;background:var(--bg4);border-radius:14px;cursor:pointer;transition:background .2s;border:1px solid var(--border)}
.toggle-thumb{position:absolute;width:21px;height:21px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .2s;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.toggle input:checked~.toggle-track{background:var(--red);border-color:var(--red)}
.toggle input:checked~.toggle-thumb{transform:translateX(19px)}
/* COUNTER */
.counter-header{margin-bottom:8px}
.counter-course{font-size:22px;font-weight:700;letter-spacing:-.4px}
.counter-sub{font-size:13px;color:var(--text2);margin-top:3px}
.count-wrap{display:flex;flex-direction:column;align-items:center;margin:28px 0}
.count-ring{width:160px;height:160px;border-radius:50%;border:3px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg2);position:relative}
.count-ring::before{content:'';position:absolute;inset:-6px;border-radius:50%;border:1px solid rgba(230,57,70,.15)}
.count-num{font-size:72px;font-weight:800;line-height:1;color:var(--text);letter-spacing:-4px}
.count-lbl{font-size:11px;color:var(--text3);margin-top:2px;text-transform:uppercase;letter-spacing:1px}
.count-btns{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:22px}
.count-btn{height:90px;border-radius:var(--radius);border:none;font-size:44px;font-weight:200;cursor:pointer;transition:all .1s;display:flex;align-items:center;justify-content:center}
.count-btn:active{transform:scale(.94)}
.btn-minus{background:var(--bg3);color:var(--text);border:1px solid var(--border)}
.btn-plus{background:var(--red);color:#fff;box-shadow:0 4px 16px rgba(230,57,70,.25)}

/* FIELDS */
.divider{height:1px;background:var(--border);margin:18px 0}
.field-group{margin-bottom:13px}
.field-label{font-size:11px;color:var(--text3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.6px;font-weight:500}
.field-input{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:13px 14px;color:var(--text);font-size:15px;transition:border-color .15s}
.field-input:focus{outline:none;border-color:var(--red)}
select.field-input option{background:var(--bg2)}

/* HISTORY */
.filter-row{display:flex;gap:7px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.chip{padding:7px 14px;border-radius:20px;border:1px solid var(--border);background:var(--bg2);color:var(--text2);font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .15s}
.chip.active{background:var(--red);color:#fff;border-color:var(--red)}
.session-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:flex-start}
.session-left{}
.session-date{font-size:14px;font-weight:600;margin-bottom:2px}
.session-course-name{font-size:12px;color:var(--text3)}
.session-cancelled{font-size:12px;color:var(--amber);margin-top:4px}
.session-right{text-align:right;flex-shrink:0;margin-left:12px}
.session-count{font-size:26px;font-weight:800;color:var(--red);line-height:1}
.session-count-lbl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}

/* STATS */
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:12px}
.stat-course-name{font-size:15px;font-weight:600;margin-bottom:14px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat-box{background:var(--bg3);border-radius:10px;padding:14px;text-align:center}
.stat-val{font-size:30px;font-weight:800;color:var(--red);line-height:1;letter-spacing:-1px}
.stat-lbl{font-size:10px;color:var(--text3);margin-top:4px;text-transform:uppercase;letter-spacing:.5px}
.bar-wrap{margin-top:4px}
.bar-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--text3);margin-bottom:5px}
.bar-track{height:5px;background:var(--bg4);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--red),#ff6b6b);border-radius:3px;transition:width .5s cubic-bezier(.4,0,.2,1)}

/* EMPTY & TOAST */
.empty{text-align:center;padding:56px 20px;color:var(--text3)}
.empty-icon{font-size:40px;margin-bottom:12px}
.empty-text{font-size:14px;line-height:1.6}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:12px 20px;font-size:14px;font-weight:500;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap;z-index:999;max-width:88vw;box-shadow:0 8px 32px rgba(0,0,0,.4)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* LOADING */
.spin{width:38px;height:38px;border:3px solid var(--bg3);border-top-color:var(--red);border-radius:50%;animation:spin .7s linear infinite}

/* SECTION HEADER */
.sec-title{font-size:13px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:14px}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>



<div id="app">
  <div id="header">
    <div id="logo-wrap">BX</div>
    <div id="header-text">
      <h1>Boxing Tracker</h1>
      <div id="header-sub">RWTH Hochschulsport Aachen</div>
    </div>
    <div id="sync-pill">
      <div id="sync-dot"></div>
      <span id="sync-lbl">—</span>
    </div>
  </div>

  <div id="content">
    <section id="sec-home" class="active"></section>
    <section id="sec-counter"></section>
    <section id="sec-history"></section>
    <section id="sec-stats"></section>
  </div>

  <nav id="nav">
    <button class="nav-btn active" data-s="home"    onclick="go('home')">   <span class="nav-icon">🏠</span>Home</button>
    <button class="nav-btn"        data-s="counter" onclick="go('counter')"><span class="nav-icon">🥊</span>Counter</button>
    <button class="nav-btn"        data-s="history" onclick="go('history')"><span class="nav-icon">📋</span>History</button>    <button class="nav-btn"        data-s="stats"   onclick="go('stats')">  <span class="nav-icon">📊</span>Stats</button>
  </nav>
</div>

<div id="toast"></div>

<script type="module">
import { initializeApp }    from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp }
                            from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

const FB = { apiKey:"AIzaSyD5m5QOdKK6Vy5Sr0HWciuviy0rAlvsik8", authDomain:"boxing-tracker-8fab1.firebaseapp.com", projectId:"boxing-tracker-8fab1", storageBucket:"boxing-tracker-8fab1.firebasestorage.app", messagingSenderId:"285906789422", appId:"1:285906789422:web:8a2b773c865bea8e94ebbf" };
const db  = getFirestore(initializeApp(FB));
const col = collection(db,'sessions');

const COURSES = [
  {id:'c1', name:'Boxing Level 1',      day:1, h:20, m:0,  label:'Monday 20:00'},
  {id:'c2', name:'Boxing Fitness',       day:1, h:21, m:30, label:'Monday 21:30'},
  {id:'c3', name:'Boxing Level 1 to 2', day:4, h:21, m:30, label:'Thursday 21:30'},
];

let sessions=[], screen='home', selCourse=null, autoDetect=true, count=0, activeCourse=null, hFilter='all';

// ── sync indicator
function sync(s){
  const d=document.getElementById('sync-dot'), l=document.getElementById('sync-lbl');
  if(!d||!l) return;
  d.className=''; 
  if(s==='ok'){d.classList.add('ok');l.textContent='synced'}
  else if(s==='err'){d.classList.add('err');l.textContent='offline'}
  else{d.classList.add('loading');l.textContent='sync…'}
}

// ── utils
function detect(){
  const now=new Date(), day=now.getDay(), m=now.getHours()*60+now.getMinutes();
  return COURSES.find(c=>c.day===day&&m>=c.h*60+c.m-60&&m<=c.h*60+c.m+120)||null;
}
function fmtDate(d){return d?new Date(d).toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'}):''}
function dateNow(){return new Date().toISOString().split('T')[0]}
function timeNow(){return new Date().toTimeString().slice(0,5)}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}

// ── navigation
window.go=function(s){
  screen=s;
  document.querySelectorAll('section').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(x=>x.classList.toggle('active',x.dataset.s===s));
  const sec=document.getElementById('sec-'+s);
  if(sec) sec.classList.add('active');
  if(s==='home')    home();
  if(s==='counter') counter();
  if(s==='history') showHistory(hFilter);
  if(s==='stats')   stats();
};

// ── HOME
function home(){
  const det=autoDetect?detect():null;
  if(!selCourse) selCourse=det?det.id:COURSES[0].id;
  let h=`<div class="row-toggle">
    <span class="row-label">Auto-detect course</span>
    <label class="toggle">
      <input type="checkbox" ${autoDetect?'checked':''} onchange="setAuto(this.checked)">
      <span class="toggle-track"></span><span class="toggle-thumb"></span>
    </label>
  </div><div class="sec-title">Select Course</div>`;
  for(const c of COURSES){
    const isSel=selCourse===c.id, isDet=det&&det.id===c.id;
    h+=`<div class="course-card ${isSel?'selected':''} ${isDet?'today':''}" onclick="pick('${c.id}')">
      <div class="course-name">${c.name}</div>
      <div class="course-time">${c.label}</div>
      ${isDet?'<span class="badge badge-today">📍 Today\'s course</span>':''}
      ${isSel&&!isDet?'<span class="badge badge-selected">✓ Selected</span>':''}
    </div>`;
  }
  h+=`<div style="margin-top:20px"><button class="btn btn-primary" onclick="startCount()">🥊 &nbsp;Start Counting</button></div>`;
  document.getElementById('sec-home').innerHTML=h;
}
window.setAuto=function(v){autoDetect=v;const d=v?detect():null;if(d)selCourse=d.id;home()};
window.pick=function(id){selCourse=id;home()};
window.startCount=function(){activeCourse=COURSES.find(c=>c.id===selCourse);count=0;go('counter')};

// ── COUNTER
function counter(){
  const c=activeCourse||COURSES[0];
  document.getElementById('sec-counter').innerHTML=`
    <div class="counter-header">
      <div class="counter-course">${c.name}</div>
      <div class="counter-sub">${c.label}</div>
    </div>
    <div class="count-wrap">
      <div class="count-ring">
        <div class="count-num" id="cnum">${count}</div>
        <div class="count-lbl">participants</div>
      </div>
    </div>
    <div class="count-btns">
      <button class="count-btn btn-minus" onclick="adj(-1)">－</button>
      <button class="count-btn btn-plus"  onclick="adj(1)">＋</button>
    </div>
    <div class="divider"></div>
    <div class="row-toggle" style="margin-bottom:14px">
      <span class="row-label">Mark as cancelled</span>
      <label class="toggle">
        <input type="checkbox" id="ctog" onchange="showReason(this.checked)">
        <span class="toggle-track"></span><span class="toggle-thumb"></span>
      </label>
    </div>
    <div id="rwrap" style="display:none" class="field-group">
      <div class="field-label">Reason (optional)</div>
      <input class="field-input" id="creason" placeholder="e.g. Public holiday…">
    </div>
    <div class="field-group">
      <div class="field-label">Date</div>
      <input class="field-input" id="sdate" type="date" value="${dateNow()}">
    </div>
    <div class="field-group">
      <div class="field-label">Time</div>
      <input class="field-input" id="stime" type="time" value="${timeNow()}">
    </div>
    <div class="field-group">
      <div class="field-label">Course</div>
      <select class="field-input" id="scourse">
        ${COURSES.map(x=>`<option value="${x.id}"${x.id===c.id?' selected':''}>${x.name}</option>`).join('')}
      </select>
    </div>
    <button class="btn btn-primary" style="margin-top:6px" onclick="save()">💾 &nbsp;Save Session</button>`;
}
window.adj=function(d){count=Math.max(0,count+d);const el=document.getElementById('cnum');if(el)el.textContent=count};
window.showReason=function(v){const w=document.getElementById('rwrap');if(w)w.style.display=v?'block':'none'};
window.save=async function(){
  sync('loading');
  const cancelled=document.getElementById('ctog')?.checked||false;
  const reason=document.getElementById('creason')?.value.trim()||'';
  const date=document.getElementById('sdate')?.value;
  const time=document.getElementById('stime')?.value;
  const courseId=document.getElementById('scourse')?.value||activeCourse?.id||COURSES[0].id;
  try{
    await addDoc(col,{courseId,count,cancelled,reason,date,time,ts:serverTimestamp()});
    sync('ok'); count=0;
    toast(cancelled?'Session saved as cancelled ✓':`Saved — ${count} participants ✓`);
    setTimeout(()=>go('history'),700);
  }catch(e){sync('err');toast('Save failed — check connection ⚠')}
};

// ── HISTORY
window.showHistory=function(f){
  hFilter=f||'all';
  const list=hFilter==='all'?sessions:sessions.filter(s=>s.courseId===hFilter);
  const sorted=[...list].sort((a,b)=>(b.ts?.seconds||0)-(a.ts?.seconds||0));
  let h=`<a href="https://hochschulsport.rwth-aachen.de/cms/hsz/das-hochschulsportzentrum/~jvfj/informationen-fuer-uebungsleitende/"
    target="_blank" class="btn btn-secondary" style="text-decoration:none;margin-bottom:10px">📅 RWTH Schedule</a>
  <button class="btn btn-secondary btn-sm" style="margin-bottom:14px" onclick="csv()">⬇ Export CSV</button>
  <div class="filter-row">
    <button class="chip ${hFilter==='all'?'active':''}" onclick="history('all')">All</button>
    ${COURSES.map(c=>`<button class="chip ${hFilter===c.id?'active':''}" onclick="history('${c.id}')">${c.name.replace('Boxing ','')}</button>`).join('')}
  </div>`;
  if(!sorted.length){
    h+=`<div class="empty"><div class="empty-icon">📋</div><div class="empty-text">No sessions yet.<br>Head to Counter to record one.</div></div>`;
  } else {
    for(const s of sorted){
      const cn=COURSES.find(c=>c.id===s.courseId)?.name||'Unknown';
      h+=`<div class="session-card">
        <div class="session-left">
          <div class="session-date">${fmtDate(s.date)} ${s.time||''}</div>
          <div class="session-course-name">${cn}</div>
          ${s.cancelled?`<div class="session-cancelled">⚠ Cancelled${s.reason?' — '+s.reason:''}</div>`:''}
        </div>
        <div class="session-right">
          <div class="session-count">${s.cancelled?'—':s.count}</div>
          <div class="session-count-lbl">${s.cancelled?'cancelled':'people'}</div>
        </div>
      </div>`;
    }
  }
  document.getElementById('sec-history').innerHTML=h;
};

// ── STATS
function stats(){
  if(!sessions.length){document.getElementById('sec-stats').innerHTML=`<div class="empty"><div class="empty-icon">📊</div><div class="empty-text">No data yet.</div></div>`;return}
  let maxAvg=0;
  const data=COURSES.map(c=>{
    const s=sessions.filter(x=>x.courseId===c.id&&!x.cancelled);
    const canc=sessions.filter(x=>x.courseId===c.id&&x.cancelled).length;
    const avg=s.length?Math.round(s.reduce((a,x)=>a+x.count,0)/s.length):0;
    if(avg>maxAvg)maxAvg=avg;
    return{c,s,canc,avg};
  });
  let h='';
  for(const{c,s,canc,avg}of data){
    const pct=maxAvg?Math.round(avg/maxAvg*100):0;
    h+=`<div class="stat-card">
      <div class="stat-course-name">${c.name}</div>
      <div class="stat-grid">
        <div class="stat-box"><div class="stat-val">${avg}</div><div class="stat-lbl">Avg attendance</div></div>
        <div class="stat-box"><div class="stat-val">${s.length}</div><div class="stat-lbl">Sessions</div></div>
      </div>
      ${canc?`<div style="font-size:12px;color:var(--amber);margin-bottom:10px">⚠ ${canc} cancelled</div>`:''}
      <div class="bar-wrap">
        <div class="bar-labels"><span>Avg vs best</span><span>${avg}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      </div>
    </div>`;
  }
  document.getElementById('sec-stats').innerHTML=h;
}

// ── CSV
window.csv=function(){
  const rows=[['Course','Date','Time','Count','Cancelled','Reason']];
  [...sessions].sort((a,b)=>(a.ts?.seconds||0)-(b.ts?.seconds||0)).forEach(s=>{
    const cn=COURSES.find(c=>c.id===s.courseId)?.name||s.courseId;
    rows.push([cn,s.date,s.time||'',s.cancelled?'':s.count,s.cancelled?'Yes':'No',s.reason||'']);
  });
  const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=Object.assign(document.createElement('a'),{href:URL.createObjectURL(new Blob([csv],{type:'text/csv'})),download:'boxing_attendance.csv'});
  a.click(); toast('CSV exported ✓');
};

// ── live sync
onSnapshot(query(col,orderBy('ts','desc')), snap=>{
  sessions=snap.docs.map(d=>({id:d.id,...d.data()}));
  sync('ok');
  document.getElementById('overlay').classList.add('gone');
  if(screen==='home')    home();
  if(screen==='history') showHistory(hFilter);
  if(screen==='stats')   stats();
}, (err)=>{
  console.error('Firestore error:',err);
  sync('err');
  document.getElementById('overlay').classList.add('gone');
  home();
});

// ── init
const img=new Image();
img.onload=()=>{document.getElementById('logo-wrap').innerHTML=`<img src="logo.jpg" alt="logo">`};
img.src='logo.jpg';
// Never block the UI — show app after 3s max regardless of Firestore
setTimeout(()=>{document.getElementById('overlay').classList.add('gone');home()},3000);
</script>
</body>
